services:
  postgres:
    image: postgres:15
    container_name: etl_postgres
    environment:
      POSTGRES_DB: etl_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      -  ./sql:/docker-entrypoint-initdb.d
  
  app:
    build: .
    container_name: etl_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: etl_postgres
      DB_PORT: 5432
      DB_NAME: etl_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - .:/app
    command: ["bash", "/app/run_etl_and_tests.sh"]

